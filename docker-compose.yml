version: '3.8'

services:
  # Landing Zone - S3 API compatible storage
  minio:
    image: minio/minio:latest
    container_name: northwind-minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - northwind-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Analytical Database - Medallion Architecture
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: northwind-clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native
    environment:
      CLICKHOUSE_DB: northwind
      CLICKHOUSE_USER: ${CH_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-password123}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - northwind-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ETL Engine - Batch Manager & Transformations (Bronze -> Silver -> Gold)
  etl-engine:
    build:
      context: .
      dockerfile: ./src/etl/Dockerfile
    container_name: northwind-etl
    depends_on:
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-password123}
      - CH_HOST=clickhouse
      - CH_PORT=8123
      - CH_USER=${CH_USER:-admin}
      - CH_PASSWORD=${CH_PASSWORD:-password123}
      - LOG_LEVEL=INFO
    networks:
      - northwind-network

  # Visualization - Streamlit Dashboard
  dashboard:
    build:
      context: .
      dockerfile: ./src/dashboard/Dockerfile
    container_name: northwind-dashboard
    ports:
      - "8501:8501"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - CH_HOST=clickhouse
      - CH_PORT=8123
      - CH_USER=${CH_USER:-admin}
      - CH_PASSWORD=${CH_PASSWORD:-password123}
    networks:
      - northwind-network

networks:
  northwind-network:
    driver: bridge

volumes:
  minio_data:
  clickhouse_data:
